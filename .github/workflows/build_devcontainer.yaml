name: 'Build devcontainer image'

# MANUAL ONLY on this fork. Upstream runs this on every push to main, but `imageName`
# below points at ghcr.io/daytonaio/* — UPSTREAM's namespace. This fork authenticates as
# ${{ github.repository_owner }} (ideaboxai) with its own GITHUB_TOKEN, which cannot push
# there, so the publish step fails with "skopeo copy failed with 1" every single time:
# 9 of 9 runs between 2026-07-20 and 2026-09-01 failed, each after building both
# linux/amd64 AND QEMU-emulated linux/arm64 first — 30-65 minutes of runner time per
# merge to main, spent on an image that has never once been published.
#
# The cost was not just the minutes: it kept a permanent red X on main, which is how a
# genuine CI failure gets missed. Dropped the push trigger rather than disabling the
# workflow in the GitHub UI, because a UI toggle is invisible state that no one reading
# this repo would ever discover.
#
# To make it work again rather than just quiet: repoint imageName/cacheFrom to
# ghcr.io/ideaboxai/daytona-devcontainer (and confirm the token has packages:write on
# that namespace), then restore the push trigger if the automatic build is wanted.
on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Setup Docker buildx for multi-architecture builds
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          use: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and release devcontainer Multi-Platform
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          # see: https://github.com/devcontainers/ci/issues/191#issuecomment-1603857155
          BUILDX_NO_DEFAULT_ATTESTATIONS: true
        with:
          imageName: ghcr.io/daytonaio/daytona-devcontainer
          cacheFrom: ghcr.io/daytonaio/daytona-devcontainer
          platform: linux/amd64,linux/arm64
          imageTag: main,latest
          configFile: .devcontainer/devcontainer.build.json
