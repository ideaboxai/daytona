name: daytona

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: daytonaio/daytona-api
    ports:
      - 3002:3002
    environment:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # Default to slim image for faster startup
      - DEFAULT_SNAPSHOT=daytonaio/sandbox:0.5.0-slim
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT}
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=${DB_HOST:?set DB_HOST in docker/.env}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME in docker/.env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      - DB_DATABASE=${DB_DATABASE:-daytona}
      - DB_TLS_ENABLED=${DB_TLS_ENABLED:-true}
      - DB_TLS_REJECT_UNAUTHORIZED=${DB_TLS_REJECT_UNAUTHORIZED:-true}
      # RDS serves a cert from Amazon's private RDS CA, which Node does not trust
      # by default; without this, TLS verification fails with SELF_SIGNED_CERT_IN_CHAIN.
      - NODE_EXTRA_CA_CERTS=/etc/ssl/rds/rds-ca-bundle.pem
      # Redis Cluster is NOT supported — the clients here are standalone-only.
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST in docker/.env}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_TLS=${REDIS_TLS:-true}
      - OIDC_CLIENT_ID=daytona
      - OIDC_ISSUER_BASE_URL=http://dex:5556/dex
      - PUBLIC_OIDC_DOMAIN=https://sandbox.ideaboxai.com/dex
      - OIDC_AUDIENCE=daytona
      - OIDC_MANAGEMENT_API_ENABLED=
      - OIDC_MANAGEMENT_API_CLIENT_ID=
      - OIDC_MANAGEMENT_API_CLIENT_SECRET=
      - OIDC_MANAGEMENT_API_AUDIENCE=
      - DASHBOARD_URL=https://sandbox.ideaboxai.com/dashboard
      - DASHBOARD_BASE_API_URL=https://sandbox.ideaboxai.com
      - POSTHOG_API_KEY=phc_bYtEsdMDrNLydXPD4tufkBrHKgfO2zbycM30LOowYNv
      - POSTHOG_HOST=https://d18ag4dodbta3l.cloudfront.net
      - POSTHOG_ENVIRONMENT=local
      - TRANSIENT_REGISTRY_URL=http://registry:6000
      - TRANSIENT_REGISTRY_ADMIN=${REGISTRY_ADMIN}
      - TRANSIENT_REGISTRY_PASSWORD=${REGISTRY_PASSWORD}
      - TRANSIENT_REGISTRY_PROJECT_ID=daytona
      - INTERNAL_REGISTRY_URL=http://registry:6000
      - INTERNAL_REGISTRY_ADMIN=${REGISTRY_ADMIN}
      - INTERNAL_REGISTRY_PASSWORD=${REGISTRY_PASSWORD}
      - INTERNAL_REGISTRY_PROJECT_ID=daytona
      # Empty host disables email entirely (org invitation is the only email sent).
      # Point at a real relay (e.g. SES) to enable invitation emails.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_EMAIL_FROM=${SMTP_EMAIL_FROM:-Daytona Team <no-reply@daytona.io>}
      - S3_ENDPOINT=http://minio:9000
      - S3_STS_ENDPOINT=http://minio:9000/minio/v1/assume-role
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_DEFAULT_BUCKET=daytona
      - S3_ACCOUNT_ID=/
      - S3_ROLE_NAME=/
      - ENVIRONMENT=docker-compose
      - MAX_AUTO_ARCHIVE_INTERVAL=43200
      - MAINTENANCE_MODE=false
      - PROXY_DOMAIN=proxy.sandbox.ideaboxai.com
      - PROXY_PROTOCOL=https
      - PROXY_API_KEY=${PROXY_API_KEY}
      - PROXY_TEMPLATE_URL=https://{{PORT}}-{{sandboxId}}.proxy.sandbox.ideaboxai.com
      - DEFAULT_RUNNER_DOMAIN=runner:3003
      - DEFAULT_RUNNER_API_URL=http://runner:3003
      - DEFAULT_RUNNER_PROXY_URL=http://runner:3003
      - DEFAULT_RUNNER_API_KEY=${DAYTONA_RUNNER_TOKEN}
      - DEFAULT_RUNNER_CPU=4
      - DEFAULT_RUNNER_MEMORY=8
      - DEFAULT_RUNNER_DISK=50
      - DEFAULT_RUNNER_NAME=default
      - DEFAULT_REGION_ID=us
      - DEFAULT_REGION_NAME=us
      - DEFAULT_REGION_ENFORCE_QUOTAS=false
      - DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA=100000
      - DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX=1000
      - DEFAULT_ORG_QUOTA_SNAPSHOT_QUOTA=1000
      - DEFAULT_ORG_QUOTA_MAX_SNAPSHOT_SIZE=1000
      - DEFAULT_ORG_QUOTA_VOLUME_QUOTA=10000
      - SSH_GATEWAY_API_KEY=${SSH_GATEWAY_API_KEY}
      - SSH_GATEWAY_COMMAND=ssh -p 2222 {{TOKEN}}@${SSH_GATEWAY_HOST}
      - SSH_GATEWAY_PUBLIC_KEY=${SSH_GATEWAY_PUBLIC_KEY}
      - SSH_GATEWAY_URL=${SSH_GATEWAY_HOST}:2222
      - RUNNER_DECLARATIVE_BUILD_SCORE_THRESHOLD=10
      - RUNNER_AVAILABILITY_SCORE_THRESHOLD=10
      - RUNNER_START_SCORE_THRESHOLD=3
      - SKIP_USER_EMAIL_VERIFICATION=true
      - RUN_MIGRATIONS=true
      - OTEL_COLLECTOR_API_KEY=${OTEL_COLLECTOR_API_KEY}
      - HEALTH_CHECK_API_KEY=${HEALTH_CHECK_API_KEY}
    volumes:
      - ./certs/rds-ca-bundle.pem:/etc/ssl/rds/rds-ca-bundle.pem:ro
    networks:
      - daytona-network
    logging: *default-logging
    restart: always
    depends_on:
      runner:
        condition: service_started
      dex:
        condition: service_started
      registry:
        condition: service_started

  proxy:
    image: daytonaio/daytona-proxy
    environment:
      - DAYTONA_API_URL=http://api:3002/api
      - PROXY_PORT=4003
      - PROXY_API_KEY=${PROXY_API_KEY}
      - PROXY_PROTOCOL=https
      - OIDC_CLIENT_ID=daytona
      - OIDC_CLIENT_SECRET=
      - OIDC_DOMAIN=http://dex:5556/dex
      - OIDC_PUBLIC_DOMAIN=https://sandbox.ideaboxai.com/dex
      - OIDC_AUDIENCE=daytona
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST in docker/.env}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_TLS=${REDIS_TLS:-true}
      - TOOLBOX_ONLY_MODE=false
      - PREVIEW_WARNING_ENABLED=false
    networks:
      - daytona-network
    logging: *default-logging
    ports:
      - 4003:4003
    restart: always

  runner:
    image: daytonaio/daytona-runner
    environment:
      - API_PORT=3003
      - DAYTONA_RUNNER_TOKEN=${DAYTONA_RUNNER_TOKEN}
      - LOG_FILE_PATH=/home/daytona/runner/runner.log
      - RESOURCE_LIMITS_DISABLED=true
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_BUCKET=daytona
      - DAYTONA_API_URL=http://api:3002/api
      - RUNNER_DOMAIN=runner
      - SSH_GATEWAY_ENABLE=true
      - SSH_PUBLIC_KEY=${SSH_GATEWAY_PUBLIC_KEY}
      - INTER_SANDBOX_NETWORK_ENABLED=true
      - DAEMON_START_TIMEOUT_SEC=300

    networks:
      - daytona-network
    logging: *default-logging
    ports:
      - 3003:3003
    volumes:
      - /usr/bin/mount-s3:/usr/bin/mount-s3:ro
    # Inline config for the inner (DinD) dockerd that runs sandboxes: bounds
    # sandbox container log growth. Merged with the image's insecure-registries.
    configs:
      - source: runner_daemon_json
        target: /etc/docker/daemon.json
        mode: 0444
    devices:
      - /dev/fuse:/dev/fuse                        
    cap_add:
      - SYS_ADMIN                                   
    security_opt:
      - apparmor:unconfined
    privileged: true  
    restart: always

  ssh-gateway:
    image: daytonaio/daytona-ssh-gateway
    environment:
      - API_URL=http://api:3002/api
      - API_KEY=${SSH_GATEWAY_API_KEY}
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}
      - SSH_HOST_KEY=${SSH_HOST_KEY}
      - SSH_GATEWAY_PORT=2222
    networks:
      - daytona-network
    logging: *default-logging
    ports:
      - 2222:2222
    restart: always

  dex:
    image: dexidp/dex:v2.42.0
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml
      - dex_db:/var/dex
    entrypoint: ['sh', '-c', 'touch /var/dex/dex.db && exec dex serve /etc/dex/config.yaml']
    networks:
      - daytona-network
    logging: *default-logging
    restart: always
    ports:
      - 5556:5556
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "https://sandbox.ideaboxai.com/dex/.well-known/openid-configuration"]

  # Postgres and Redis are external managed services (RDS / ElastiCache); the
  # in-stack `db` and `redis` containers were removed. pgAdmin and MailDev were
  # dev-only tools and are gone with them. Connection details live in docker/.env.

  registry-ui:
    image: joxit/docker-registry-ui:main
    restart: always
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Docker Registry UI
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - NGINX_PROXY_PASS_URL=http://registry:6000
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - TAGLIST_PAGE_SIZE=100
      - REGISTRY_SECURED=false
      - CATALOG_ELEMENTS_LIMIT=1000
    networks:
      - daytona-network
    logging: *default-logging
    ports:
      - 127.0.0.1:5100:80

  registry:
    image: registry:2.8.2
    restart: always
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[http://registry-ui.example.com]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: registry:6000
    volumes:
      - registry:/var/lib/registry
    networks:
      - daytona-network
    logging: *default-logging
    ports:
      - 127.0.0.1:6000:6000

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_IDENTITY_STS_EXPIRY="24h"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - daytona-network
    logging: *default-logging
    restart: always
    ports:
      - 127.0.0.1:9001:9001

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    networks:
      - daytona-network
    logging: *default-logging
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=10000
      - OTEL_TRACES_SAMPLER=always_off
      - COLLECTOR_QUEUE_SIZE_MEMORY=128
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
      - BADGER_SPAN_STORE_TTL=24h0m0s   
    mem_limit: 1g
    mem_reservation: 512m
    restart: always
    ports:
      - 127.0.0.1:16686:16686
    volumes:
      - jaeger-badger:/badger

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - daytona-network
    logging: *default-logging
    restart: always

configs:
  runner_daemon_json:
    content: |
      {
        "insecure-registries": ["registry:6000"],
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

volumes:
  registry: {}
  minio_data: {}
  dex_db: {}
  jaeger-badger: {}


networks:
  daytona-network:
    driver: bridge
