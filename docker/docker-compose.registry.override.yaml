# Registry override — pull ALL images from ONE registry (${FORK_REGISTRY}).
#
# PRIMARY path for clients who pull from our ECR (e.g. actian): our 4 server images
# are repointed by docker-compose.ec2-http.override.yaml; this file repoints the 6
# THIRD-PARTY images to the same prefix. Together, all 10 come from ${FORK_REGISTRY} —
# no Docker Hub at deploy. Seed the third-party into the registry first with
# scripts/fork/mirror-thirdparty.sh (into our ECR) or seed-registry.sh (client's own).
#
# The daytona-sandbox default snapshot is an 11th delivered image under ${FORK_REGISTRY}
# but is NOT a compose service — the runner pulls it at runtime, so install.sh relays it
# into the on-box registry:6000 and points DEFAULT_SNAPSHOT_IMAGE there. Not repointed here.
#
# The third-party repo names MUST match what mirror-thirdparty.sh / seed-registry.sh
# push (and the ECR repositories DevOps created): dex, docker-registry-ui, registry,
# jaegertracing/all-in-one, minio, opentelemetry-collector-contrib. NB the names are
# deliberately irregular — jaeger keeps its org prefix, the others dropped theirs —
# so keep this file, mirror-thirdparty.sh, and seed-registry.sh in lockstep.
#
# Tag: unified to ${FORK_TAG}, same as the 4 server images (ec2-http override). All
# 10 stack images carry ONE client tag per v1.4.32.md. mirror-thirdparty.sh /
# dev-ecr-mirror.yml pull each source at its real upstream tag but re-tag the dest
# to the stack tag, so set FORK_TAG == that stack tag (e.g. 1.4.32).
#
# ${FORK_REGISTRY} = registry host + namespace, e.g.
#   120354378950.dkr.ecr.us-east-1.amazonaws.com/ideaboxai-platform-core
#
# Apply LAST, after base + ec2-http override:
#   docker compose --env-file docker/.env \
#     -f docker/docker-compose.yaml \
#     -f docker/docker-compose.ec2-http.override.yaml \
#     -f docker/docker-compose.registry.override.yaml pull

name: daytona

services:
  dex:
    image: ${FORK_REGISTRY}/dex:${FORK_TAG}
  registry-ui:
    image: ${FORK_REGISTRY}/docker-registry-ui:${FORK_TAG}
  registry:
    image: ${FORK_REGISTRY}/registry:${FORK_TAG}
  jaeger:
    image: ${FORK_REGISTRY}/jaegertracing/all-in-one:${FORK_TAG}
  minio:
    image: ${FORK_REGISTRY}/minio:${FORK_TAG}
  otel-collector:
    image: ${FORK_REGISTRY}/opentelemetry-collector-contrib:${FORK_TAG}
