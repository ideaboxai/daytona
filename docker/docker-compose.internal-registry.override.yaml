# Internal-registry override — pull ALL images from the client's own registry.
#
# For clients (e.g. air-gapped) who mirror every image into their internal registry
# and configure their nodes to pull only from it — no Docker Hub, no vendor ECR at
# deploy. Our 4 server images are already repointed to ${FORK_REGISTRY} by
# docker-compose.ec2-http.override.yaml; this file repoints the 6 THIRD-PARTY images
# to the same prefix. Seed the registry first with seed-registry.sh, which pushes
# every image to exactly these paths.
#
# ${FORK_REGISTRY} = the client's registry prefix, host[:port][/namespace], e.g.
#   registry.actian.internal:5000/daytona
#
# Apply LAST, after the base + ec2-http override:
#   docker compose --env-file docker/.env \
#     -f docker/docker-compose.yaml \
#     -f docker/docker-compose.ec2-http.override.yaml \
#     -f docker/docker-compose.internal-registry.override.yaml up -d

name: daytona

services:
  dex:
    image: ${FORK_REGISTRY}/dexidp/dex:v2.42.0
  registry-ui:
    image: ${FORK_REGISTRY}/joxit/docker-registry-ui:main
  registry:
    image: ${FORK_REGISTRY}/registry:2.8.2
  jaeger:
    image: ${FORK_REGISTRY}/jaegertracing/all-in-one:1.67.0
  minio:
    image: ${FORK_REGISTRY}/minio/minio:latest
  otel-collector:
    image: ${FORK_REGISTRY}/otel/opentelemetry-collector-contrib:0.138.0
